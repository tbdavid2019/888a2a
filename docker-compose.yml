services:
  db:
    image: postgres:16-alpine
    container_name: 888a2a-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: 888a2a
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: ${A2A888_DB_PASSWORD:?A2A888_DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d 888a2a"]
      interval: 5s
      timeout: 5s
      retries: 5

  manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: tbdavid2019/888a2a:latest
    container_name: 888a2a-manager
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8181:8181"
    environment:
      A2A888_PG_URL: ${A2A888_PG_URL:?A2A888_PG_URL must be set}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8181/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  machine:
    build:
      context: .
      dockerfile: scripts/docker/Dockerfile.machine
    image: tbdavid2019/888a2a-machine:latest
    container_name: 888a2a-machine
    restart: unless-stopped
    depends_on:
      manager:
        condition: service_started
    environment:
      A2A888_MANAGER_URL: "http://manager:8181"
      A2A888_HOME: "/data"
    volumes:
      - machinedata:/data
      - codexhome:/home/a2a888/.codex

volumes:
  pgdata:
    driver: local
  machinedata:
    driver: local
  codexhome:
    driver: local
