services:
  db:
    image: postgres:16-alpine
    container_name: 888a2a-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: 888a2a
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: ${A2A888_DB_PASSWORD:?A2A888_DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d 888a2a"]
      interval: 5s
      timeout: 5s
      retries: 5

  manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: tbdavid2019/888a2a:latest
    container_name: 888a2a-manager
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8181:8181"
    environment:
      A2A888_PG_URL: ${A2A888_PG_URL:?A2A888_PG_URL must be set}
      A2A888_HUB_MODE: ${A2A888_HUB_MODE:-public}
      A2A888_HUB_ID: ${A2A888_HUB_ID:-public}
      A2A888_HUB_BOOTSTRAP_TOKEN: ${A2A888_HUB_BOOTSTRAP_TOKEN:-}
      A2A888_HUB_OPERATOR_TOKEN: ${A2A888_HUB_OPERATOR_TOKEN:-}
      A2A888_HUB_PUBLIC_CONFIRM: ${A2A888_HUB_PUBLIC_CONFIRM:-true}
      A2A888_HUB_REGISTRATION_TTL_SECONDS: ${A2A888_HUB_REGISTRATION_TTL_SECONDS:-86400}
      A2A888_HUB_PEER_LEASE_SECONDS: ${A2A888_HUB_PEER_LEASE_SECONDS:-90}
      A2A888_HUB_MAX_REGISTERED_AGENTS: ${A2A888_HUB_MAX_REGISTERED_AGENTS:-100}
      A2A888_HUB_MAX_TASKS_PER_MINUTE: ${A2A888_HUB_MAX_TASKS_PER_MINUTE:-60}
      A2A888_HUB_MAX_CONCURRENT_TASKS: ${A2A888_HUB_MAX_CONCURRENT_TASKS:-4}
      A2A888_HUB_MAX_PAYLOAD_BYTES: ${A2A888_HUB_MAX_PAYLOAD_BYTES:-1048576}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8181/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  machine:
    build:
      context: .
      dockerfile: scripts/docker/Dockerfile.machine
    image: tbdavid2019/888a2a-machine:latest
    container_name: 888a2a-machine
    restart: unless-stopped
    depends_on:
      manager:
        condition: service_started
    environment:
      A2A888_MANAGER_URL: "http://manager:8181"
      A2A888_HOME: "/data"
    volumes:
      - machinedata:/data
      - codexhome:/home/a2a888/.codex

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: 888a2a-prometheus
    restart: unless-stopped
    profiles: [observability]
    depends_on:
      manager:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    container_name: 888a2a-grafana
    restart: unless-stopped
    profiles: [observability]
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
    driver: local
  machinedata:
    driver: local
  codexhome:
    driver: local
  prometheusdata:
    driver: local
  grafanadata:
    driver: local
