services:
  db:
    image: postgres:16-alpine
    container_name: 888a2a-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: 888a2a
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: ${A2A888_DB_PASSWORD:?A2A888_DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d 888a2a"]
      interval: 5s
      timeout: 5s
      retries: 5

  manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: tbdavid2019/888a2a:latest
    container_name: 888a2a-manager
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8181:8181"
    environment:
      A2A888_PG_URL: ${A2A888_PG_URL:?A2A888_PG_URL must be set}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8181/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  machine:
    build:
      context: .
      dockerfile: scripts/docker/Dockerfile.machine
    image: tbdavid2019/888a2a-machine:latest
    container_name: 888a2a-machine
    restart: unless-stopped
    depends_on:
      manager:
        condition: service_started
    environment:
      A2A888_MANAGER_URL: "http://manager:8181"
      A2A888_HOME: "/data"
    volumes:
      - machinedata:/data
      - codexhome:/home/a2a888/.codex

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: 888a2a-prometheus
    restart: unless-stopped
    profiles: [observability]
    depends_on:
      manager:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    container_name: 888a2a-grafana
    restart: unless-stopped
    profiles: [observability]
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
    driver: local
  machinedata:
    driver: local
  codexhome:
    driver: local
  prometheusdata:
    driver: local
  grafanadata:
    driver: local
