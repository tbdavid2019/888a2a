name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Agent Network naming
        run: scripts/tests/check_agent_network_naming_test.sh

      - name: Download Go modules
        run: go mod download

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5
          golangci-lint run --timeout=10m --enable-only=gosimple,govet,ineffassign,staticcheck,unused --allow-parallel-runners

      - name: Test
        run: go test ./...
        env:
          A2A888_RUN_MIGRATION_TESTS: "1"
          A2A888_TEST_PG_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/postgres?sslmode=disable

      - name: Build
        run: go build -ldflags "-w -s" -p=16 -o ./build/888a2a ./backend/manager/bin/server/main.go

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm --dir frontend exec biome check src

      - name: Check project rules
        run: pnpm --dir frontend check

      - name: Type check
        run: pnpm --dir frontend type-check

      - name: Test
        run: pnpm --dir frontend test

      - name: Build
        run: pnpm --dir frontend build
