name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Agent Network naming
        run: scripts/tests/check_agent_network_naming_test.sh

      - name: Download Go modules
        run: go mod download

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5
          golangci-lint run --enable-only=gosimple,govet,ineffassign,staticcheck,unused --allow-parallel-runners

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -ldflags "-w -s" -p=16 -o ./build/888a2a ./backend/manager/bin/server/main.go

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm --dir frontend exec biome check src

      - name: Check project rules
        run: pnpm --dir frontend check

      - name: Type check
        run: pnpm --dir frontend type-check

      - name: Test
        run: pnpm --dir frontend test

      - name: Build
        run: pnpm --dir frontend build
